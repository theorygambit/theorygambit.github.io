      .c1{animation:fs-c1 12s cubic-bezier(0.16,0.4,0.15,1) infinite} .c2{animation:fs-c2 12s cubic-bezier(0.16,0.4,0.15,1) infinite} .c3{animation:fs-c3 12s cubic-bezier(0.16,0.4,0.15,1) infinite}

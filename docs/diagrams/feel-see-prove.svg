<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="t d">
  <title id="t">Feel, See, Prove</title>
  <desc id="d">Every Theory Gambit game has three beats in this order. Feel: play first and collect evidence. See: the structure is revealed from your own moves. Prove: apply the idea to a case you have not met.</desc>

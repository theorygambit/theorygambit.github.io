  <rect class="bg" x="0" y="0" width="1200" height="500"/>
  <rect x="0" y="0" width="1200" height="500" fill="url(#light)"/>
  <rect x="0" y="0" width="1200" height="500" filter="url(#grain)" opacity=".05"/>
  <text class="k" x="45" y="48">EVERY GAME HAS EXACTLY THREE BEATS, IN THIS ORDER</text>
  <path class="hair" d="M45 62H1155"/>

  <g class="c1">
    <rect class="cd" x="45" y="84" width="360" height="370"/>
    <text class="cn" x="73" y="118"><tspan class="bone">01</tspan>  FEEL</text>
    <g class="gbp" transform="translate(85 118) scale(.85)"><path class="gbp-hair" d="M0 0"/>
    <g class="gbp-board"><path pathLength="1" d="M70 76H250V200H70Z"/><path pathLength="1" d="M160 76V200"/><path pathLength="1" d="M70 138H250"/></g>
    <circle class="gbp-ring gbp-them-l" cx="115" cy="53" r="5.5"/><circle class="gbp-ring gbp-them-r" cx="205" cy="53" r="5.5"/>
    <circle class="gbp-alt gbp-alt-bl" cx="115" cy="169" r="12.25"/><circle class="gbp-alt gbp-alt-br" cx="205" cy="169" r="8.66"/>
    <circle class="gbp-you gbp-you-tl" cx="115" cy="107" r="11.18"/><circle class="gbp-you gbp-you-tr" cx="205" cy="107" r="7.07"/></g>
    <text class="ct" x="73" y="360">Play first.</text>
    <text class="cb" x="73" y="392">Four rounds, no tutorial. Each round also shows</text>
    <text class="cb" x="73" y="413">what the row you did not pick would have paid.</text>
  </g>

  <g class="c2">
    <rect class="cd" x="420" y="84" width="360" height="370"/>
    <text class="cn" x="448" y="118"><tspan class="bone">02</tspan>  SEE</text>
    <g class="gbp" transform="translate(460 118) scale(.85)"><path class="gbp-hair" d="M0 0"/>
    <g class="gbp-board"><path pathLength="1" d="M70 76H250V200H70Z"/><path pathLength="1" d="M160 76V200"/><path pathLength="1" d="M70 138H250"/></g>
    <circle class="gbp-ring" cx="115" cy="53" r="5.5"/><circle class="gbp-ring" cx="205" cy="53" r="5.5"/>
    <circle class="gbp-win gbp-win-bl" cx="115" cy="169" r="12.25"/><circle class="gbp-win gbp-win-br" cx="205" cy="169" r="8.66"/>
    <circle class="gbp-you gbp-you-tl" cx="115" cy="107" r="11.18"/><circle class="gbp-you gbp-you-tr" cx="205" cy="107" r="7.07"/>
    <g class="gbp-arrows"><path class="gbp-arrow gbp-arrow-l" pathLength="1" d="M115 122V150"/><path class="gbp-head gbp-head-l" d="M110.5 145.5L115 150.5L119.5 145.5"/><path class="gbp-arrow gbp-arrow-r" pathLength="1" d="M205 118V154"/><path class="gbp-head gbp-head-r" d="M200.5 149L205 154L209.5 149"/></g></g>
    <text class="ct" x="448" y="360">See the structure.</text>
    <text class="cb" x="448" y="392">Built from your own moves. Tap each column</text>
    <text class="cb" x="448" y="413">and the better row appears. The same row</text>
    <text class="cb" x="448" y="434">wins both times.</text>

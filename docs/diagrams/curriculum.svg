      .md{fill:none;stroke:#c9cfd2;stroke-width:1.3}
      .lv{fill:#e6e3da}
      .sy{fill:none;stroke:#e6e3da;stroke-opacity:.7}
      .d{animation:wave 9.6s cubic-bezier(0.16,0.4,0.15,1) infinite;animation-delay:calc(var(--i) * 36ms)}
      @keyframes wave{0%,100%{opacity:.62}7%{opacity:1}15%{opacity:.62}}
      .halo{fill:none;stroke:#e6e3da;stroke-opacity:.35;transform-box:fill-box;transform-origin:center;animation:halo 4.8s cubic-bezier(0.16,0.4,0.15,1) infinite}
      @keyframes halo{0%{transform:scale(.7);opacity:.7}70%,100%{transform:scale(2.6);opacity:0}}
      .lg{font-family:'Jost','DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:300;font-size:13px;fill:#9aa3a8}
      .br{stroke:rgba(214,219,222,0.18);fill:none}
      @media (prefers-reduced-motion: reduce){*{animation:none!important}}
    </style>
